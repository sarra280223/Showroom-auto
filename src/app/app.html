<app-head-bar></app-head-bar>

<main class="showroom">
  <section class="collection" aria-labelledby="collection-title">
    <div class="section-heading">
      <div>
        <p class="eyebrow">The collection</p>
        <h2 id="collection-title">Find the right fit</h2>
      </div>
      <span class="vehicle-count">{{ autoList.length }} vehicles</span>
    </div>
  </section>

  <app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>

  @if(selectedCar) {
    <section class="selected-car" aria-live="polite">
      <img [src]="'images/' + selectedCar.photo" [alt]="selectedCar.brand + ' ' + selectedCar.model">
      <div class="selected-details">
        <p class="eyebrow">{{ selectedCar.brand }}</p>
        <h2>{{ selectedCar.model }}</h2>
        <p class="description">{{ selectedCar.description }}</p>
        <p class="selected-specs">{{ selectedCar.power }} CV <span>·</span> {{ selectedCar.availability }} available</p>
      </div>
    </section>
  }
</main>
